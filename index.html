<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 flex justify-center">
    <div class="max-w-md w-full bg-white p-6 rounded-xl shadow-md border border-slate-200">
        <h3 class="text-lg font-bold mb-4">🎤 Laboratório de Pronúncia</h3>
        <p class="text-sm text-slate-500 mb-6">Ouça a frase original e depois grave a sua.</p>
        
        <div id="sentence-display" class="p-4 bg-indigo-50 border-l-4 border-indigo-600 rounded mb-4 font-medium text-indigo-900 text-lg">
            "Vocês iam muito ao cinema antigamente."
        </div>

        <div class="flex gap-2 mb-4">
            <button id="listen-btn" class="flex-1 bg-slate-200 text-slate-700 py-2 rounded-lg font-bold hover:bg-slate-300 transition">
                Ouvir Frase
            </button>
            <button id="start-btn" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-bold hover:bg-indigo-700 transition">
                Começar
            </button>
        </div>

        <div id="feedback" class="mt-4 p-3 rounded text-sm hidden text-center font-medium"></div>
    </div>

    <script>
        const sentences = [
            "Vocês iam muito ao cinema antigamente.",
            "Eles são brasileiros, mas moram fora.",
            "Você estava muito distraído ontem."
        ];
        
        let currentIndex = 0;
        let isListening = false;
        
        const display = document.getElementById('sentence-display');
        const startBtn = document.getElementById('start-btn');
        const listenBtn = document.getElementById('listen-btn');
        const feedback = document.getElementById('feedback');
        
        // Função para normalizar (remove acentos e pontuação para comparar)
        function normalize(text) {
            return text.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/[?.!]/g, "")
                .trim();
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = false; 

        listenBtn.onclick = () => {
            const utterance = new SpeechSynthesisUtterance(sentences[currentIndex]);
            utterance.lang = 'pt-BR';
            window.speechSynthesis.speak(utterance);
        };

        startBtn.onclick = () => {
            if (!isListening) {
                isListening = true;
                startBtn.innerText = "Parar Gravação";
                startBtn.className = "flex-1 bg-red-600 text-white py-2 rounded-lg font-bold hover:bg-red-700 transition";
                feedback.className = "mt-4 p-3 rounded text-sm text-center bg-yellow-100 text-yellow-800";
                feedback.innerText = "Ouvindo...";
                feedback.classList.remove('hidden');
                recognition.start();
            } else {
                recognition.stop();
            }
        };

        recognition.onend = () => {
            isListening = false;
            startBtn.innerText = "Começar";
            startBtn.className = "flex-1 bg-indigo-600 text-white py-2 rounded-lg font-bold hover:bg-indigo-700 transition";
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            const normalizedTranscript = normalize(transcript);
            const normalizedTarget = normalize(sentences[currentIndex]);
            
            // Comparação direta
            if (normalizedTranscript === normalizedTarget) {
                feedback.className = "mt-4 p-3 rounded text-sm text-center bg-green-100 text-green-800";
                feedback.innerText = "✅ Excelente! Você acertou.";
                
                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % sentences.length;
                    display.innerText = '"' + sentences[currentIndex] + '"';
                    feedback.classList.add('hidden');
                }, 2000);
            } else {
                feedback.className = "mt-4 p-3 rounded text-sm text-center bg-red-100 text-red-800";
                feedback.innerText = "❌ Tente novamente! Você disse: '" + transcript + "'.";
            }
        };
    </script>
</body>
</html>
